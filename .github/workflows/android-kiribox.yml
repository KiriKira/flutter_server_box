name: KiriBox Android

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the signed APKs as a GitHub Release after both builds succeed
        type: boolean
        default: false
      release_revision:
        description: Optional release tag suffix for a corrected build of the same app version
        type: string
        default: ''
      run_adb_tests:
        description: Run the optional KVM Android Wireless ADB integration test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kiribox-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            filename: app-arm64-v8a-release-unsigned.apk
          - abi: amd64
            filename: app-x86_64-release-unsigned.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          lfs: true
          persist-credentials: false
      - name: Require persistent signing secrets
        env:
          KEYSTORE: ${{ secrets.KIRIBOX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KIRIBOX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KIRIBOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KIRIBOX_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$KEYSTORE" ]] || missing+=(KIRIBOX_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(KIRIBOX_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(KIRIBOX_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(KIRIBOX_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Configure repository secrets before building: ${missing[*]}"
            exit 1
          fi
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Install pinned Android tools
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(tr -d '[:space:]' < android/compile-sdk-version.txt)"
          tools="$(tr -d '[:space:]' < android/build-tools-version.txt)"
          ndk="$(tr -d '[:space:]' < android/ndk-version.txt)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$sdk" "build-tools;$tools" "ndk;$ndk"
          echo "APKSIGNER=$ANDROID_HOME/build-tools/$tools/apksigner" >> "$GITHUB_ENV"
          echo "AAPT2=$ANDROID_HOME/build-tools/$tools/aapt2" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - name: Build unsigned release
        run: bash scripts/release/build-fdroid.sh ${{ matrix.abi }}
      - name: Verify the compiled Android package name
        env:
          UNSIGNED_FILENAME: ${{ matrix.filename }}
        run: |
          version="$(sed -n 's/^version: //p' pubspec.yaml | cut -d+ -f1)"
          bash scripts/release/verify-kiribox-apk.sh "build/app/outputs/apk/release/$UNSIGNED_FILENAME" "$version"
      - name: Sign with the fixed release identity
        env:
          KIRIBOX_KEYSTORE_BASE64: ${{ secrets.KIRIBOX_KEYSTORE_BASE64 }}
          KIRIBOX_KEYSTORE_PASSWORD: ${{ secrets.KIRIBOX_KEYSTORE_PASSWORD }}
          KIRIBOX_KEY_ALIAS: ${{ secrets.KIRIBOX_KEY_ALIAS }}
          KIRIBOX_KEY_PASSWORD: ${{ secrets.KIRIBOX_KEY_PASSWORD }}
          ABI: ${{ matrix.abi }}
          UNSIGNED_FILENAME: ${{ matrix.filename }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml | cut -d+ -f1)"
          bash scripts/release/sign-kiribox-apk.sh \
            "build/app/outputs/apk/release/$UNSIGNED_FILENAME" "dist/kiribox-$version-$ABI.apk"
          cp android/kiribox-signing-sha256.txt dist/CERTIFICATE-SHA256.txt
          (cd dist && sha256sum kiribox-*.apk > SHA256SUMS.txt)
      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kiribox-signed-${{ matrix.abi }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload unsigned input for validation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kiribox-unsigned-${{ matrix.abi }}
          path: build/app/outputs/apk/release/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 7
      - name: Signing result
        run: |
          echo 'Release APK signed with the fixed KiriBox identity and verified against the committed certificate pin.' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish signed KiriBox release
    needs: [apk, adb-emulator]
    if: >-
      always() && inputs.publish_release && github.ref == 'refs/heads/main'
      && needs.apk.result == 'success'
      && (needs['adb-emulator'].result == 'skipped' || needs['adb-emulator'].result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download signed APKs from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: kiribox-signed-*
          path: dist
          merge-multiple: true
      - name: Verify release attachments
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml | cut -d+ -f1)"
          [[ "$version" =~ ^1\.0\.[0-9]+$ ]]
          for abi in arm64 amd64; do
            test -f "dist/kiribox-$version-$abi.apk"
          done
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 2
          cmp android/kiribox-signing-sha256.txt dist/CERTIFICATE-SHA256.txt
          tools="$(tr -d '[:space:]' < android/build-tools-version.txt)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$tools"
          export AAPT2="$ANDROID_HOME/build-tools/$tools/aapt2"
          for apk in dist/*.apk; do
            bash scripts/release/verify-kiribox-apk.sh "$apk" "$version"
            "$ANDROID_HOME/build-tools/$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certificate.txt"
            actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certificate.txt" | head -1)"
            test "$actual" = "$(tr -d '[:space:]' < android/kiribox-signing-sha256.txt)"
          done
          (cd dist && sha256sum kiribox-*.apk > SHA256SUMS.txt)
          # Refuse to repoint an existing tag or silently replace a release.
          release_tag="v$version"
          if [[ -n "$RELEASE_REVISION" ]]; then
            [[ "$RELEASE_REVISION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]
            release_tag="$release_tag-$RELEASE_REVISION"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --silent 2>/dev/null; then
            echo '::error::Release tag already exists; inspect it before publishing again'
            exit 1
          fi
          echo "KIRIBOX_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "KIRIBOX_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RAN_ADB_TESTS: ${{ inputs.run_adb_tests }}
        run: |
          set -euo pipefail
          version="$KIRIBOX_RELEASE_VERSION"
          {
            printf 'KiriBox %s，版本编号对齐上游 ServerBox v%s，基于本仓库当前 ADB 实现构建。\n\n' "$version" "$version"
            printf '%s\n' '- 支持 Wireless ADB、本机配对、Android 状态和可选 root 增强。' \
              '- 提供 ADB 终端、APK 安装、应用管理、文件传输、日志和截图。' \
              '- Android 工具页提供屏幕控制：scrcpy 直连画面、多指触摸、系统导航键和双向文本剪贴板；不传音频，直接使用目标手机输入法。' \
              '- 本地 AI agent 可通过 ADB 管理手机。' \
              '- 附件包含 ARM64 和 x86-64 APK，均使用同一持久化签名。'
            if [[ "$RAN_ADB_TESTS" == true ]]; then
              printf '%s\n' '- ADB 模拟器测试已通过。'
            else
              printf '%s\n' '- 本次未运行 ADB 模拟器测试，屏幕控制尚未完成真机验收。'
            fi
            printf '\n签名证书 SHA-256：`%s`\n' "$(cat android/kiribox-signing-sha256.txt)"
            printf '\nAndroid 安装包 ID：`tech.kirikira.kiribox`。已从编译后的 APK manifest 验证，可与原版 ServerBox 独立安装。\n'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$KIRIBOX_RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt dist/CERTIFICATE-SHA256.txt \
            --target "$RELEASE_COMMIT" --title "KiriBox $KIRIBOX_RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest

  adb-emulator:
    name: Wireless ADB on KVM Android
    if: inputs.run_adb_tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Probe supplied SSH address from the runner
        run: |
          python3 - <<'PY'
          import socket
          try:
              with socket.create_connection(('18.118.132.34', 22), timeout=10) as connection:
                  connection.settimeout(5)
                  print('SSH TCP reachable:', connection.recv(256).decode(errors='replace').strip())
          except OSError as error:
              print('SSH unavailable from this runner:', type(error).__name__, str(error))
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [[ ! -e /dev/kvm ]]; then
            sudo modprobe kvm_intel || sudo modprobe kvm_amd
          fi
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install pinned Android tools
        run: |
          sdk="$(tr -d '[:space:]' < android/compile-sdk-version.txt)"
          tools="$(tr -d '[:space:]' < android/build-tools-version.txt)"
          ndk="$(tr -d '[:space:]' < android/ndk-version.txt)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$sdk" "build-tools;$tools" "ndk;$ndk"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - run: flutter pub get --enforce-lockfile
      - name: Build ADB integration app
        run: flutter build apk --debug --target-platform android-x64 --target integration_test/adb_device_test.dart --dart-define=KIRIBOX_ADB_E2E=true
      - name: Run real Wireless debugging pairing and device operations
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/run-adb-emulator.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kiribox-adb-emulator-evidence
          path: build/adb-e2e/
          if-no-files-found: warn
          retention-days: 14
